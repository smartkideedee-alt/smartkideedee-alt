  <text x="55" y="158" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="750" letter-spacing="1">DONG ENLONG</text>
  <text x="58" y="203" fill="#b9c8e8" font-family="Arial, Helvetica, sans-serif" font-size="23">AI research  /  music  /  product building</text>
  <rect x="57" y="232" width="270" height="34" rx="17" fill="#1d3858" stroke="#4a7795"/>
