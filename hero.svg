<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">DONG Enlong — AI, Music, Product</title>
  <desc id="desc">A neon audio waveform flows through a network of nodes behind DONG Enlong's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091225"/><stop offset=".55" stop-color="#14234a"/><stop offset="1" stop-color="#0b172e"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32d6d0"/><stop offset=".55" stop-color="#8b8fff"/><stop offset="1" stop-color="#fa8ab4"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c80ff" stop-opacity=".42"/><stop offset="1" stop-color="#7c80ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d9ecff" stroke-opacity=".055"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="1200" height="310" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="24" fill="url(#grid)"/>
  <circle cx="930" cy="142" r="195" fill="url(#glow)"/>
  <g fill="none" stroke="#91a6ff" stroke-opacity=".22" stroke-width="1.2">
    <path d="M695 70 786 115 886 62 978 111 1091 75M786 115 842 187 978 111 1043 194 1133 165M842 187 910 246 1043 194 1137 245"/>
  </g>
  <g fill="#a8b6ff"><circle cx="786" cy="115" r="4"/><circle cx="886" cy="62" r="3"/><circle cx="978" cy="111" r="5"/><circle cx="842" cy="187" r="4"/><circle cx="1043" cy="194" r="5"/><circle cx="910" cy="246" r="3"/></g>
  <path d="M668 160h40l15-27 16 54 21-91 20 133 21-73h27l17-38 22 81 18-45h31l16-75 19 148 21-93 18 22h29" fill="none" stroke="url(#wave)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".45" filter="url(#blur)"/>
  <path d="M668 160h40l15-27 16 54 21-91 20 133 21-73h27l17-38 22 81 18-45h31l16-75 19 148 21-93 18 22h29" fill="none" stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1040" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1040;0;0" dur="7s" repeatCount="indefinite"/>
